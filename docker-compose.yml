services:
  ros-jazzy:
    container_name: ros-jazzy
    build:
      context: .
      dockerfile: Docker/Dockerfile
      args:
        USERNAME: shapzonlinux
    ipc: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=42
    volumes:
      # Code workspace mount (fixed path matching non-root user home)
      - ./ros-packages:/home/shapzonlinux/cobot_ws/src
      
      # User home (configs, bashrc)
      - ros-home-jazzy:/home/shapzonlinux
      
      # Display & GPU
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri:rw
      - ${HOME}/.Xauthority:/home/shapzonlinux/.Xauthority:rw
    
    stdin_open: true
    tty: true

volumes:
  ros-home-jazzy:
    driver: local